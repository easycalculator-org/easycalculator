<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Download time formula and worked example</title>
  <desc id="desc">Time in seconds equals file size in GB multiplied by 8000, divided by speed in Mbps multiplied by efficiency as a decimal. For 10 GB at 100 Mbps and 100 percent efficiency, the result is 800 seconds, or 13 minutes 20 seconds. At 90 percent efficiency, the result is approximately 889 seconds, or 14 minutes 49 seconds. Decimal GB is used.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1100" height="680" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="678" rx="23" fill="none" stroke="#d9e4f4" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#203047">
    <rect x="44" y="38" width="54" height="54" rx="14" fill="#2454b8"/>
    <path d="M71 49v23m-9-9 9 9 9-9M58 78h26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="58" font-size="14" font-weight="700" letter-spacing="2" fill="#2454b8">EASYCALCULATOR</text>
    <text x="114" y="89" font-size="29" font-weight="700">Download Time: Formula &amp; Example</text>

    <rect x="44" y="120" width="1012" height="190" rx="16" fill="#fff" stroke="#cbdcf3"/>
    <text x="68" y="153" font-size="15" font-weight="700" fill="#2454b8" letter-spacing="1">THE FORMULA</text>
    <text x="85" y="221" font-size="27" font-weight="700">Time (seconds) =</text>
    <text x="682" y="196" text-anchor="middle" font-size="27" font-weight="700">File size (GB) × 8,000</text>
    <line x1="375" y1="210" x2="995" y2="210" stroke="#2454b8" stroke-width="2"/>
    <text x="682" y="246" text-anchor="middle" font-size="27" font-weight="700">Speed (Mbps) × Efficiency</text>
    <text x="68" y="285" font-size="18" fill="#52627a">Use efficiency as a decimal: 100% = 1.00   •   90% = 0.90</text>

    <rect x="44" y="332" width="620" height="236" rx="16" fill="#fff" stroke="#cbdcf3"/>
    <text x="68" y="365" font-size="15" font-weight="700" fill="#2454b8" letter-spacing="1">WORKED EXAMPLE</text>
    <text x="68" y="402" font-size="23" font-weight="700">10 GB file · 100 Mbps · 100% efficiency</text>
    <text x="68" y="443" font-size="25">(10 × 8,000) ÷ (100 × 1.00)</text>
    <text x="68" y="483" font-size="25">= 800 seconds</text>
    <rect x="68" y="501" width="572" height="46" rx="10" fill="#eaf2ff"/>
    <text x="354" y="532" text-anchor="middle" font-size="27" font-weight="700" fill="#2454b8">13 minutes 20 seconds</text>

    <rect x="684" y="332" width="372" height="236" rx="16" fill="#edf8f4" stroke="#c3e4d8"/>
    <text x="708" y="365" font-size="15" font-weight="700" fill="#17664d" letter-spacing="1">AT 90% EFFICIENCY</text>
    <text x="708" y="402" font-size="21">Effective speed = 90 Mbps</text>
    <text x="708" y="443" font-size="23">80,000 ÷ 90 ≈ 889 sec</text>
    <text x="708" y="491" font-size="27" font-weight="700" fill="#17664d">14 minutes 49 seconds</text>
    <text x="708" y="535" font-size="17" fill="#42665c">Illustrative reduced-speed scenario</text>

    <text x="44" y="602" font-size="17" fill="#52627a">Decimal units: 1 GB = 1,000 MB   •   1 byte = 8 bits   •   100 Mbps = 12.5 MB/s</text>
    <text x="44" y="633" font-size="16" fill="#52627a">Assumes constant throughput. Actual times vary; installation and extraction are excluded.</text>
    <text x="1056" y="658" text-anchor="end" font-size="14" fill="#2454b8">easycalculator.org</text>
  </g>
</svg>
