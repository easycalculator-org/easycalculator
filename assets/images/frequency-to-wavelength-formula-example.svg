<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Frequency to wavelength formula and 900 MHz example</title>
<desc id="desc">For electromagnetic waves in free space, wavelength lambda equals the speed of light divided by frequency. At 900 megahertz, wavelength is approximately 0.333103 meters or 33.3103 centimeters. The diagram marks one wavelength between consecutive crests.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2454bc"/></marker></defs>
<rect width="1200" height="820" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#182d49">
<text x="60" y="65" font-size="16" font-weight="700" letter-spacing="2" fill="#2454bc">RF FORMULAS · EASYCALCULATOR</text>
<text x="60" y="118" font-size="40" font-weight="700">Frequency to Wavelength</text>
<text x="60" y="155" font-size="21" fill="#53647b">Convert electromagnetic frequency into wavelength in free space.</text>
<rect x="60" y="190" width="1080" height="160" rx="18" fill="#132c50"/>
<text x="100" y="257" font-size="46" font-weight="700" fill="#ffffff">λ = c / f</text>
<text x="100" y="310" font-size="21" fill="#d6e6ff">Wavelength = speed of light ÷ frequency</text>
<path d="M650 218 V322" stroke="#60799d"/>
<g font-size="21" fill="#ffffff"><text x="686" y="235">λ = wavelength in meters (m)</text><text x="686" y="275">f = frequency in hertz (Hz)</text><text x="686" y="315">c = 299,792,458 m/s (exact)</text></g>
<text x="600" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#2454bc">One wavelength (λ): crest to crest</text>
