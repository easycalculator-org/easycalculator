<text x="88" y="607" font-size="22" font-weight="700" fill="#2454bc">EXAMPLE · 900 MHz</text>
<text x="88" y="651" font-size="23">f = 900 × 10⁶ = 900,000,000 Hz</text>
<text x="88" y="695" font-size="23">λ = 299,792,458 ÷ 900,000,000</text>
