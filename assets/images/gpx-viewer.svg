<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">

    <defs>

        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f8fbff"/>
            <stop offset="100%" stop-color="#edf5ff"/>
        </linearGradient>

        <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".18"/>
        </filter>

    </defs>

    <!-- Background -->

    <rect width="512"
          height="512"
          rx="32"
          fill="url(#bg)"/>

    <!-- Card -->

    <rect x="36"
          y="36"
          width="440"
          height="440"
          rx="24"
          fill="#ffffff"
          filter="url(#shadow)"/>

    <!-- Header -->

    <rect x="36"
          y="36"
          width="440"
          height="64"
          rx="24"
          fill="#2563eb"/>

    <text x="256"
          y="76"
          font-size="24"
          font-family="Arial"
          font-weight="700"
          fill="#fff"
          text-anchor="middle">
        GPX Viewer
    </text>

    <!-- Map Grid -->

    <g stroke="#dbeafe" stroke-width="1">

        <line x1="80" y1="140" x2="432" y2="140"/>
        <line x1="80" y1="190" x2="432" y2="190"/>
        <line x1="80" y1="240" x2="432" y2="240"/>
        <line x1="80" y1="290" x2="432" y2="290"/>
        <line x1="80" y1="340" x2="432" y2="340"/>

        <line x1="120" y1="120" x2="120" y2="360"/>
        <line x1="180" y1="120" x2="180" y2="360"/>
        <line x1="240" y1="120" x2="240" y2="360"/>
        <line x1="300" y1="120" x2="300" y2="360"/>
        <line x1="360" y1="120" x2="360" y2="360"/>
        <line x1="420" y1="120" x2="420" y2="360"/>

    </g>

    <!-- GPX Route -->

    <path d="M105 330
             C150 280 170 200 230 215
             C280 225 300 150 355 170
             C385 180 405 145 430 165"
          fill="none"
          stroke="url(#route)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Start -->

    <circle cx="105"
            cy="330"
            r="12"
            fill="#22c55e"/>

    <circle cx="105"
            cy="330"
            r="22"
            fill="none"
            stroke="#22c55e"
            stroke-width="4"
            opacity=".25"/>

    <!-- Waypoints -->

    <circle cx="170"
            cy="240"
            r="7"
            fill="#f59e0b"/>

    <circle cx="230"
            cy="215"
            r="7"
            fill="#f59e0b"/>

    <circle cx="300"
            cy="180"
            r="7"
            fill="#f59e0b"/>

    <!-- Finish Pin -->

    <g>

        <path d="M408 165
                 C408 145 424 130 442 130
                 C460 130 476 145 476 165
                 C476 194 442 226 442 226
                 C442 226 408 194 408 165Z"
              fill="#2563eb"/>

        <circle cx="442"
                cy="165"
                r="9"
                fill="#fff"/>

    </g>

    <!-- Upload Icon -->

    <circle cx="95"
            cy="415"
            r="24"
            fill="#eff6ff"/>

    <path d="M95 425
             V398"
          stroke="#2563eb"
          stroke-width="4"
          stroke-linecap="round"/>

    <path d="M85 408
             L95 398
             L105 408"
          fill="none"
          stroke="#2563eb"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <line x1="80"
          y1="425"
          x2="110"
          y2="425"
          stroke="#2563eb"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- GPX Badge -->

    <rect x="165"
          y="390"
          width="182"
          height="48"
          rx="24"
          fill="#eff6ff"
          stroke="#bfdbfe"/>

    <text x="256"
          y="421"
          font-size="24"
          font-family="Arial"
          font-weight="700"
          fill="#2563eb"
          text-anchor="middle">
        .GPX
    </text>

    <!-- Compass -->

    <circle cx="410"
            cy="415"
            r="26"
            fill="#eff6ff"
            stroke="#bfdbfe"/>

    <path d="M410 397
             L416 420
             L404 414
             Z"
          fill="#2563eb"/>

    <text x="410"
          y="450"
          text-anchor="middle"
          font-size="11"
          font-family="Arial"
          fill="#64748b">
        GPS
    </text>

</svg>