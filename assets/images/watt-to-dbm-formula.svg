<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Watt to dBm Formula with a 20 Watt Example</title>
  <desc id="desc">Power in dBm equals 10 times the base-10 logarithm of power in watts divided by 1 watt, plus 30. For 20 watts: log base 10 of 20 is approximately 1.30103, multiply by 10 to get 13.0103, then add 30 to get approximately 43.01 dBm. Power in watts must be greater than zero.</desc>
  <rect width="1200" height="720" rx="24" fill="#f1f5f9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="32" y="32" width="1136" height="656" rx="20" fill="#ffffff" stroke="#dbe4ef"/>
    <path d="M52 32 H1148 Q1168 32 1168 52 V148 H32 V52 Q32 32 52 32" fill="#175cd3"/>
    <text x="68" y="88" font-size="36" font-weight="700" fill="#ffffff">Watt to dBm Conversion</text>
    <text x="68" y="123" font-size="20" fill="#e0edff">Formula + worked RF power example</text>
    <text x="72" y="192" font-size="15" font-weight="700" letter-spacing="2" fill="#475569">CONVERSION FORMULA</text>
    <rect x="68" y="212" width="1064" height="110" rx="14" fill="#eff6ff"/>
    <text x="104" y="286" font-size="40" font-weight="700" fill="#143d79">P(dBm) = 10 log<tspan baseline-shift="sub" font-size="26">10</tspan><tspan baseline-shift="baseline">(P(W) / 1 W) + 30</tspan></text>
    <text x="72" y="354" font-size="19" fill="#475569">P(W): power in watts, greater than 0 • log₁₀: base-10 logarithm</text>
    <text x="72" y="409" font-size="26" font-weight="700" fill="#0f172a">Example: convert 20 watts to dBm</text>
    <g font-size="23" fill="#334155">
      <text x="88" y="458">1. Take log₁₀ of 20</text><text x="405" y="458" font-weight="700">log₁₀(20) ≈ 1.30103</text>
      <text x="88" y="503">2. Multiply by 10</text><text x="405" y="503" font-weight="700">10 × 1.30103 ≈ 13.0103</text>
      <text x="88" y="548">3. Add 30</text><text x="405" y="548" font-weight="700">13.0103 + 30 ≈ 43.0103</text>
    </g>
    <rect x="790" y="429" width="342" height="136" rx="16" fill="#ecfdf3" stroke="#abefc6"/>
    <text x="961" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#067647">20 W</text>
    <text x="961" y="511" text-anchor="middle" font-size="36" font-weight="700" fill="#05603a">≈ 43.01 dBm</text>
    <text x="961" y="541" text-anchor="middle" font-size="16" fill="#067647">Referenced to 1 milliwatt</text>
    <path d="M68 602 H1132" stroke="#e2e8f0"/>
    <text x="72" y="639" font-size="19" fill="#475569">Reference: 0.001 W = 0 dBm • 1 W = 30 dBm • 10 W = 40 dBm</text>
    <text x="1128" y="668" text-anchor="end" font-size="17" font-weight="700" fill="#175cd3">easycalculator.org</text>
  </g>
</svg>
