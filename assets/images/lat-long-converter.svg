<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">

<rect width="1200" height="1200" fill="#F7FBFF"/>

<rect x="70" y="70" width="1060" height="1060"
rx="36"
