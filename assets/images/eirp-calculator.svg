<svg width="100%" height="100%" viewBox="0 0 1200 700"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="eirpTitle eirpDesc">

  <title id="eirpTitle">EIRP Calculator</title>
  <desc id="eirpDesc">
    EIRP calculation showing transmitter power, cable loss, other losses,
    antenna gain and the resulting effective isotropic radiated power.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf5ff"/>
    </linearGradient>

    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#084298"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10"
                    flood-color="#1e3a5f"
                    flood-opacity=".12"/>
    </filter>

    <marker id="arrowBlue"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0d6efd"/>
    </marker>

    <marker id="arrowRed"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc3545"/>
    </marker>

    <marker id="arrowOrange"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f59f00"/>
    </marker>

    <marker id="arrowGreen"
            markerWidth="9"
            markerHeight="9"
            refX="8"
            refY="4.5"
            orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#198754"/>
    </marker>
  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1200" height="700" fill="url(#bg)"/>


  <!-- ================= TITLE ================= -->

  <text x="600" y="55"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="40"
        font-weight="700"
        fill="#173f67">
    EIRP Calculator
  </text>

  <text x="600" y="84"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#64748b">
    Effective Isotropic Radiated Power
  </text>

  <text x="600" y="112"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        fill="#64748b">
    Transmitter power, antenna gain and losses determine EIRP
  </text>


  <!-- ================= MAIN CARD ================= -->

  <rect x="35" y="135"
        width="1130"
        height="350"
        rx="24"
        fill="#ffffff"
        filter="url(#shadow)"/>


  <!-- ================= TX POWER ================= -->

  <rect x="60" y="210"
        width="195"
        height="135"
        rx="18"
        fill="#eef5ff"
        stroke="#b8d4ff"
        stroke-width="2"/>

  <!-- simple transmitter icon -->
  <rect x="92" y="266"
        width="70"
        height="42"
        rx="7"
        fill="#334155"/>

  <rect x="102" y="276"
        width="25"
        height="10"
        rx="3"
        fill="#dbeafe"/>

  <circle cx="140" cy="281" r="5" fill="#dbeafe"/>
  <circle cx="155" cy="281" r="5" fill="#dbeafe"/>

  <rect x="113" y="308"
        width="10"
        height="8"
        rx="2"
        fill="#334155"/>

  <rect x="141" y="308"
        width="10"
        height="8"
        rx="2"
        fill="#334155"/>

  <text x="190" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#0d6efd">
    Tx Power
  </text>

  <text x="190" y="264"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="700"
        fill="#173f67">
    30 dBm
  </text>

  <text x="190" y="333"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        fill="#64748b">
    Transmitter Output
  </text>


  <!-- ================= ARROW 1 ================= -->

  <line x1="255" y1="277"
        x2="285" y2="277"
        stroke="#0d6efd"
        stroke-width="4"
        marker-end="url(#arrowBlue)"/>


  <!-- ================= CABLE LOSS ================= -->

  <rect x="290" y="210"
        width="190"
        height="135"
        rx="18"
        fill="#fff1f2"
        stroke="#f1aeb5"
        stroke-width="2"/>

  <!-- simple cable -->
  <path d="M325 280
           C345 245 385 245 405 280
           C425 315 450 315 455 280"
        fill="none"
        stroke="#475569"
        stroke-width="12"
        stroke-linecap="round"/>

  <path d="M325 280
           C345 245 385 245 405 280
           C425 315 450 315 455 280"
        fill="none"
        stroke="#94a3b8"
        stroke-width="4"
        stroke-linecap="round"/>

  <text x="385" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#dc3545">
    Cable Loss 2 dB
  </text>

  

  <text x="385" y="333"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        fill="#64748b">
    Feeder / Cable
  </text>


  <!-- ================= ARROW 2 ================= -->

  <line x1="480" y1="277"
        x2="510" y2="277"
        stroke="#dc3545"
        stroke-width="4"
        marker-end="url(#arrowRed)"/>


  <!-- ================= OTHER LOSSES ================= -->

  <rect x="515" y="210"
        width="190"
        height="135"
        rx="18"
        fill="#fff8e6"
        stroke="#ffd66b"
        stroke-width="2"/>

  <!-- simple connector/filter icon -->
  <rect x="570" y="264"
        width="80"
        height="35"
        rx="7"
        fill="#64748b"/>

  <rect x="557" y="273"
        width="13"
        height="17"
        rx="3"
        fill="#475569"/>

  <rect x="650" y="273"
        width="13"
        height="17"
        rx="3"
        fill="#475569"/>

  <circle cx="590" cy="281" r="5" fill="#ffffff"/>
  <circle cx="610" cy="281" r="5" fill="#ffffff"/>
  <circle cx="630" cy="281" r="5" fill="#ffffff"/>

  <text x="610" y="238"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#b66a00">
    Other Losses 1 dB
  </text>

 

  <text x="610" y="333"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        fill="#64748b">
    Connectors, Filters, etc.
  </text>


  <!-- ================= ARROW 3 ================= -->

  <line x1="705" y1="277"
        x2="735" y2="277"
        stroke="#f59f00"
        stroke-width="4"
        marker-end="url(#arrowOrange)"/>


  <!-- ================= SIMPLE TOWER ================= -->

  <rect x="740" y="185"
        width="185"
        height="220"
        rx="18"
        fill="#eef9f2"
        stroke="#b9e5ca"
        stroke-width="2"/>

  <!-- antenna mast -->
  <line x1="830" y1="315"
        x2="830" y2="220"
        stroke="#374151"
        stroke-width="6"/>

  <!-- simple tower -->
  <path d="M800 350 L830 270 L860 350"
        fill="none"
        stroke="#374151"
        stroke-width="5"
        stroke-linejoin="round"/>

  <!-- tower cross bars -->
  <line x1="806" y1="330" x2="854" y2="330"
        stroke="#64748b"
        stroke-width="3"/>

  <line x1="812" y1="312" x2="848" y2="312"
        stroke="#64748b"
        stroke-width="3"/>

  <line x1="818" y1="294" x2="842" y2="294"
        stroke="#64748b"
        stroke-width="3"/>

  <!-- antenna panel -->
  <rect x="821" y="215"
        width="18"
        height="58"
        rx="3"
        fill="#198754"/>

  <!-- signal waves -->
  <path d="M850 225 Q875 245 850 265"
        fill="none"
        stroke="#198754"
        stroke-width="4"
        stroke-linecap="round"/>

  <path d="M862 215 Q900 245 862 275"
        fill="none"
        stroke="#198754"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".65"/>

  <text x="832" y="205"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="700"
        fill="#198754">
    Antenna Gain
  </text>

  <text x="832" y="388"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#146c43">
    +15 dBi
  </text>


  <!-- ================= ARROW 4 ================= -->

  <line x1="925" y1="277"
        x2="950" y2="277"
        stroke="#198754"
        stroke-width="4"
        marker-end="url(#arrowGreen)"/>


  <!-- ================= RESULT ================= -->

  <rect x="955" y="190"
        width="180"
        height="170"
        rx="20"
        fill="#ffffff"
        stroke="#b8d4ff"
        stroke-width="2"
        filter="url(#shadow)"/>

  <text x="1045" y="225"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="700"
        fill="#173f67">
    EIRP Result
  </text>

  <rect x="975" y="240"
        width="140"
        height="75"
        rx="14"
        fill="url(#result)"/>

  <text x="1045" y="278"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#ffffff">
    42 dBm
  </text>

  <text x="1045" y="301"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        fill="#dbeafe">
    15.85 W
  </text>

  <text x="1045" y="338"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#64748b">
    Effective Isotropic
  </text>

  <text x="1045" y="353"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#64748b">
    Radiated Power
  </text>


  <!-- ================= FORMULA ================= -->

  <rect x="60" y="520"
        width="1080"
        height="145"
        rx="20"
        fill="#ffffff"
        stroke="#cbdcf0"
        stroke-width="2"/>

  <text x="90" y="555"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="700"
        fill="#173f67">
    EIRP Formula
  </text>

  <text x="90" y="588"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#334155">
    EIRP (dBm) =
  </text>

  <text x="215" y="588"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#334155">
    Tx Power + Antenna Gain − Cable Loss − Other Losses
  </text>

  <text x="90" y="620"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#334155">
    EIRP (W) =
  </text>

  <text x="185" y="620"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        fill="#334155">
    10^((EIRP(dBm) − 30) / 10)
  </text>

  <!-- conversion badge -->
  <rect x="895" y="565"
        width="205"
        height="55"
        rx="14"
        fill="#eef5ff"
        stroke="#c7ddff"/>

  <text x="997" y="599"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#0d6efd">
    1 W = 30 dBm
  </text>

  <!-- ================= FOOTER ================= -->

 

</svg>